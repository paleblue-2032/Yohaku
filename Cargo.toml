[package]
name = "shiori"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "栞付きのシンプルなメモ帳エディタ"
license = "MIT"

[dependencies]
eframe = { version = "0.36", features = ["wayland", "persistence"] }
egui = "0.36"
egui_commonmark = "0.25"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = true
strip = true
codegen-units = 1
