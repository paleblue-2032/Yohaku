name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          cache: true

      # 3 OS すべてでコンパイルが通ることを確認する
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # macOS: Qt を同梱した .app を zip に
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake --install build --prefix "$PWD/dist"
          APP=$(find dist -maxdepth 3 -name '*.app' | head -1)
          macdeployqt "$APP" -qmldir=qml
          ditto -c -k --sequesterRsrc --keepParent "$APP" yohaku-macos.zip

      # Windows: windeployqt で DLL を集めて zip に
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --install build --prefix "$PWD/dist" --config Release
          $exe = Get-ChildItem -Recurse -Filter yohaku.exe dist | Select-Object -First 1
          windeployqt --release --qmldir qml $exe.FullName
          Compress-Archive -Path "$($exe.DirectoryName)\*" -DestinationPath yohaku-windows-x86_64.zip

      # Linux は配布物としては Nix (nix run github:paleblue-2032/yohaku) を推奨。
      # ここではビルドが通ることの確認まで。
      - name: Note (Linux)
        if: runner.os == 'Linux'
        run: echo "Linux への導入は Nix (nix run / home.packages) を推奨。tarball は作らない。"

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: yohaku-macos
          path: yohaku-macos.zip

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: yohaku-windows
          path: yohaku-windows-x86_64.zip
