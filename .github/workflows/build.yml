name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # タグ push 時にリリースを作るため

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libdbus-1-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          cache: true

      # 3 OS すべてでコンパイルが通ることを確認する
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # ---- パッケージ ----

      # macOS: Qt を同梱した .app を zip に
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake --install build --prefix "$PWD/dist"
          APP=$(find dist -maxdepth 3 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo ".app が見つかりません"; find dist -maxdepth 3; exit 1; fi
          macdeployqt "$APP" -qmldir=qml
          ditto -c -k --sequesterRsrc --keepParent "$APP" "yohaku-macos-$(uname -m).zip"

      # Windows: windeployqt で DLL を集めて zip に
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --install build --prefix "$PWD/dist" --config Release
          $exe = Get-ChildItem -Recurse -Filter yohaku.exe dist | Select-Object -First 1
          windeployqt --release --qmldir qml $exe.FullName
          Compress-Archive -Path "$($exe.DirectoryName)\*" -DestinationPath yohaku-windows-x86_64.zip

      # Linux: 実行ファイル + .desktop + アイコンを tarball に（Qt6 は各ディストリのものを使う）
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --install build --prefix "$PWD/dist"
          mkdir -p pkg
          cp -a dist/. pkg/
          cp scripts/install-local.sh pkg/install.sh
          chmod +x pkg/install.sh
          cat > pkg/README.txt <<'EOS'
          Yohaku (Linux tarball)

          必要なもの (Qt 6.5+):
            Debian/Ubuntu: libqt6core6 libqt6gui6 libqt6qml6 libqt6quick6 \
                           libqt6quickcontrols2-6 qml6-module-qtquick \
                           qml6-module-qtquick-controls qml6-module-qtquick-layouts \
                           qml6-module-qtquick-dialogs qml6-module-qtquick-effects
            Arch:          qt6-base qt6-declarative qt6-quickcontrols2
            Fedora:        qt6-qtbase qt6-qtdeclarative qt6-qtquickcontrols2

          インストール:
            ./install.sh          # ホームディレクトリに入れて .desktop も登録
            もしくは bin/yohaku を直接実行

            インストールせずに試すだけなら: ./bin/yohaku

          Nix が使えるなら `nix run github:paleblue-2032/yohaku` が手軽です。
          EOS
          tar -C pkg -czf yohaku-linux-x86_64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yohaku-${{ matrix.os }}
          path: |
            yohaku-*.zip
            yohaku-*.tar.gz

  # タグ (v*) を push したら GitHub Release に成果物を添付する
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/**/yohaku-*.zip
            assets/**/yohaku-*.tar.gz
          generate_release_notes: true
